<!DOCTYPE html>

  <meta charset="UTF-8" />

  <title>LingoVibe HK ⚡ — Blind Listening & Vibe Cards Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f4f6fb; -webkit-tap-highlight-color: transparent; }
    .syl-pill { display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 8px; font-weight: 800; font-size: 0.82rem; transition: transform .15s; }
    .syl-pill:active { transform: scale(0.92); }
    .syl-0 { background: #dbeafe; color: #1e40af; }
    .syl-1 { background: #fce7f3; color: #9d174d; }
    .syl-2 { background: #dcfce7; color: #166534; }
    .syl-3 { background: #fef3c7; color: #92400e; }
    .syl-4 { background: #ede9fe; color: #5b21b6; }
    .role-S { background: #dbeafe; color: #1e3a8a; border: 1px solid #93c5fd; }
    .role-V { background: #ffe4e6; color: #9f1239; border: 1px solid #fda4af; }
    .role-O { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .role-M { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .pop-card { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .pop-card:hover { transform: translateY(-2px); }
    .btn-bounce:active { transform: scale(0.94); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .shake { animation: shake 0.3s ease-in-out; }
    @keyframes pulseRing { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(139, 92, 246, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
    .audio-pulse { animation: pulseRing 2s infinite; }
    .holo-card { background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #0f172a 100%); position: relative; overflow: hidden; }
    .holo-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.14) 45%, rgba(255,255,255,0.0) 60%); pointer-events: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="text-slate-800 min-h-screen flex flex-col lg:flex-row pb-16 lg:pb-0">

  <!-- MOBILE DRAWER BACKDROP -->
  <div id="drawerBackdrop" onclick="toggleDrawer(false)" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-40 hidden lg:hidden"></div>

  <!-- LEFT NAVIGATION SIDEBAR -->
  <aside id="leftNav" class="fixed lg:sticky top-0 left-0 h-full lg:h-screen w-80 max-w-[86vw] bg-slate-950 text-white flex flex-col border-r border-slate-800 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 shrink-0">
    <!-- Brand & Live Rank Card -->
    <div class="p-4 border-b border-slate-800 bg-gradient-to-br from-violet-950 via-slate-950 to-fuchsia-950">

        <div>
          <div class="flex items-center gap-1.5">
            <span class="bg-gradient-to-r from-violet-500 to-fuchsia-500 text-[10px] font-black uppercase px-2 py-0.5 rounded-full">EDB 2,000 Words</span>
            <span class="text-[11px] text-emerald-400 font-bold">⚡ Auto-Save</span>
          </div>
          <h1 class="text-xl font-black tracking-tight mt-1 bg-gradient-to-r from-violet-300 via-fuchsia-300 to-amber-300 bg-clip-text text-transparent">
            LingoVibe HK ⚡
          </h1>
        </div>
        <button onclick="toggleDrawer(false)" class="lg:hidden w-8 h-8 rounded-xl bg-slate-800 text-slate-300 font-bold">✕</button>
      </div>
      <!-- Mini Rank Badge Pill -->
      <div onclick="switchTrack('vibe')" class="mt-3 p-2.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between cursor-pointer hover:bg-white/10 transition">
        <div class="flex items-center gap-2">
          <span id="sideRankIcon" class="text-xl">🌱</span>
          <div>
            <div class="text-[10px] text-slate-400 font-bold uppercase">Current Rank</div>
            <div id="sideRankTitle" class="text-xs font-black text-amber-300">Syllable Rookie</div>
          </div>
        </div>
        <span class="text-[10px] bg-violet-500/30 text-violet-200 px-2 py-0.5 rounded-full font-bold">查看徽章 →</span>
      </div>
    </div>

    <!-- Key Stage Switcher -->
    <div class="p-3 border-b border-slate-800">
      <div class="text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1.5 px-1">🎮 Select Key Stage</div>
      <div class="grid grid-cols-2 gap-1.5" id="ksBar"></div>
    </div>

    <!-- Mode Switcher (Now with #5 Blind Listening & #6 Vibe Cards) -->
    <div class="p-3 border-b border-slate-800">
      <div class="text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1.5 px-1">🧭 Quest Track</div>
      <div class="flex flex-col gap-1" id="moduleSwitcher"></div>
    </div>

    <!-- Scrollable Unit / Theme List -->
    <div class="p-3 flex-1 overflow-y-auto space-y-1.5">
      <div class="flex items-center justify-between px-1">
        <span class="font-extrabold text-xs text-slate-200" id="sidebarTitle"></span>
        <span class="text-[10px] font-bold bg-violet-500/20 text-violet-300 px-2 py-0.5 rounded-full" id="stageCountLabel"></span>
      </div>
      <p class="text-[11px] text-slate-400 px-1" id="sidebarHint"></p>
      <div id="sidebarList" class="space-y-1.5 pt-1"></div>
    </div>

    <!-- Footer Actions -->
    <div class="p-3 border-t border-slate-800 bg-slate-900 flex gap-2">
      <button onclick="unlockAll()" class="flex-1 text-xs bg-gradient-to-r from-amber-400 to-orange-400 text-slate-950 font-black py-2 rounded-xl btn-bounce shadow">
        🔓 一键全解锁 (God Mode)
      </button>
      <button onclick="resetProgress()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-rose-900 text-xs" title="重置进度">🔄</button>
    </div>
  </aside>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Sticky Top Energy Bar -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 px-3 lg:px-8 py-2.5 shadow-xs">
      <div class="max-w-5xl mx-auto space-y-2">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <button onclick="toggleDrawer(true)" class="lg:hidden px-2.5 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-black shrink-0 btn-bounce">
              ☰ 目录
            </button>
            <p class="text-xs font-extrabold text-slate-700 truncate" id="scaffoldingBanner"></p>
          </div>
          <!-- Gamified XP & Streak Pills -->
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="switchTrack('vibe')" class="px-2.5 py-1 rounded-full bg-orange-100 text-orange-700 font-black text-xs flex items-center gap-1 btn-bounce">
              🔥 <b id="streakNum">0</b>
            </button>
            <button onclick="switchTrack('vibe')" class="px-2.5 py-1 rounded-full bg-violet-100 text-violet-700 font-black text-xs flex items-center gap-1 btn-bounce">
              ⚡ <b id="xpNum">0</b> XP
            </button>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100">
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5 max-w-full" id="stepNav"></div>
          <div id="searchWrapper" class="w-full sm:w-auto">

          </div>
        </div>
      </div>
    </header>

    <!-- Dynamic Stage Content -->
    <main class="flex-1 px-3 lg:px-8 py-4 lg:py-6">
      <div class="max-w-5xl mx-auto">
        <div id="mainBox" class="bg-white rounded-3xl shadow-sm border border-slate-200/90 p-4 lg:p-6 min-h-[520px]"></div>
      </div>
    </main>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION BAR (5 THUMB TARGETS) -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 bg-slate-950 text-white border-t border-slate-800 z-30 grid grid-cols-5 py-1.5 px-1 text-[10px] font-extrabold">

    <button onclick="toggleDrawer(true)" class="flex flex-col items-center py-1 rounded-xl text-violet-300">
      <span class="text-sm">☰</span><span>选关/考卷</span>
    </button>
  </nav>

        { wrong: "The panel recommended that the law is abolished.", options: ["The panel recommended that the law be abolished.", "The panel recommended that the law was abolished."], ans: 0, explain: "Subjunctive requires base verb 'be'." }
      ],
      quiz: [
        { q: "1. If the witness had testified, the defendant ___ convicted.", opts: ["will be", "would be", "would have been", "had been"], a: 2 },
        { q: "2. Formal inversion of 'If the bank had monitored...':", opts: ["Did the bank monitor...", "Had the bank monitored...", "Have the bank monitored...", "Should the bank monitored..."], a: 1 },
        { q: "3. It is vital that the judiciary ___ impartial.", opts: ["remains", "remained", "remain", "is remaining"], a: 2 },
        { q: "4. I wish I ___ more attention to well-being last year.", opts: ["paid", "pay", "had paid", "would pay"], a: 2 },
        { q: "5. Mixed: If she had taken the scholarship in 2024, she ___ at university now.", opts: ["would be studying", "would have studied", "will be studying", "studied"], a: 0 }
      ]
    },
    {
      id: "g_ks4_4", title: "G19. Nominalization & Academic Hedging",
      formula: "[Verb/Adj Clause → Abstract Noun Phrase] + [Hedging: tends to / appears to / may contribute to]",
      guide: "Turn spoken verb-heavy clauses into formal noun phrases (Nominalization) and avoid extreme absolutes by using measured hedging verbs.",
      contrast: "❌ Spoken: People eat too much sugar so everyone gets fat. → ✅ Excessive sugar consumption tends to increase obesity risk.",
      examples: [
        { s: "The implementation of plastic legislation", v: "has reduced", o: "waste generation.", m: "", zh: "Nominalized subject & object." },
        { s: "Prolonged academic stress", v: "appears to correlate with", o: "adolescent anxiety.", m: "", zh: "Hedged academic claim." }
      ],
      scramblers: [
        { prompt: "The proliferation of misinformation poses a threat to social harmony.", chunks: ["The proliferation of", "misinformation", "poses a threat", "to social harmony."], ans: "The proliferation of misinformation poses a threat to social harmony." },
        { prompt: "A sedentary lifestyle is widely believed to contribute to chronic illness.", chunks: ["A sedentary lifestyle", "is widely believed", "to contribute to", "chronic illness."], ans: "A sedentary lifestyle is widely believed to contribute to chronic illness." }
      ],
      pitfalls: [
        { wrong: "AI will definitely destroy 100% of human jobs tomorrow.", options: ["AI may render certain repetitive jobs obsolete over time.", "AI must destroy every job immediately."], ans: 0, explain: "Academic writing uses measured hedging ('may render...')." },
        { wrong: "Because the district was revitalized, it attracted tourists.", options: ["The revitalization of the district enhanced its appeal to tourists.", "Revitalize the district attracted tourists."], ans: 0, explain: "Nominalize into 'The revitalization of...'." }
      ],
      quiz: [
        { q: "1. Best nominalization of 'Because they abolished the tariff, trade grew':", opts: ["Abolish tariff made trade grow.", "The abolition of the tariff stimulated trade growth.", "Because of abolish tariff, trade grew.", "The tariff abolished so trade growth."], a: 1 },
        { q: "2. Noun form of 'proliferate':", opts: ["proliferative", "proliferation", "proliferating", "proliferated"], a: 1 },
        { q: "3. Which demonstrates academic hedging?", opts: ["undoubtedly proves beyond doubt", "tends to suggest a strong correlation", "always forces every citizen", "never has any effect"], a: 1 },
        { q: "4. 'The rapid ___ of automation transformed industry.'", opts: ["expand", "expansive", "expansion", "expanded"], a: 2 },
        { q: "5. Most formal academic sentence:", opts: ["Old people make hospitals broke.", "An ageing demographic places fiscal strain on public healthcare.", "Because people live long, hospitals have no cash.", "Hospitals spend too much money on old people."], a: 1 }
      ]
    },
    {
      id: "g_ks4_5", title: "G20. Discourse Markers & Concession Syntax",
      formula: "[Despite / In spite of + Noun / V-ing] vs. [Although / Whereas / While + Subject + Verb Clause]",
      guide: "'Despite' and 'In spite of' are prepositions (followed by a Noun or Gerund, NEVER a bare clause, and never 'Despite of'). 'Although/Whereas/While' take full clauses.",
      contrast: "❌ Error: Despite of the cost / Despite it was expensive → ✅ Despite the high cost...",
      examples: [
        { s: "Despite the convenience of e-commerce,", v: "physical shops", o: "remain indispensable.", m: "", zh: "Despite + Noun Phrase." },
        { s: "Whereas rote learning focuses on memory,", v: "inquiry-based learning", o: "nurtures critical thinking.", m: "", zh: "Whereas + contrasting clause." }
      ],
      scramblers: [
        { prompt: "In spite of facing obstacles, the team achieved a breakthrough.", chunks: ["In spite of", "facing obstacles,", "the team", "achieved a breakthrough."], ans: "In spite of facing obstacles, the team achieved a breakthrough." },
        { prompt: "The proposal is viable; furthermore, it enjoys public consensus.", chunks: ["The proposal is viable;", "furthermore,", "it enjoys", "public consensus."], ans: "The proposal is viable; furthermore, it enjoys public consensus." }
      ],
      pitfalls: [
        { wrong: "Despite of the stringent regulations, illicit trade continues.", options: ["Despite the stringent regulations, illicit trade continues.", "In spite the stringent regulations, illicit trade continues."], ans: 0, explain: "'Despite' never takes 'of'." },
        { wrong: "Despite the economy grew rapidly, wealth disparity widened.", options: ["Despite the rapid economic growth, wealth disparity widened.", "In spite of the economy grew rapidly, wealth disparity widened."], ans: 0, explain: "Follow 'Despite' with a noun phrase ('the rapid economic growth')." }
      ],
      quiz: [
        { q: "1. ___ the exorbitant fees, thousands of applicants compete.", opts: ["Although", "Despite", "Whereas", "Nevertheless"], a: 1 },
        { q: "2. ___ the law is well-intentioned, enforcement is difficult.", opts: ["Despite", "In spite of", "Notwithstanding", "Although"], a: 3 },
        { q: "3. Which links two contrasting clauses inside one sentence?", opts: ["However", "Nevertheless", "Whereas", "Consequently"], a: 2 },
        { q: "4. The firm failed to innovate; ___, its products became obsolete.", opts: ["consequently", "despite", "whereas", "although"], a: 0 },

      ]
    }
  ]
};

  stage: "KS1", track: "vocab", themeIdx: 0, grammarIdx: 0, step: 1, page: 0,
  xp: 0, streak: 0, blindClears: 0, activeDays: {},
  unlocked: { KS1: true, KS2: false, KS3: false, KS4: false },
  passedThemes: {}, passedGrammar: {}, mastered: {}
};

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getCurrentRank() {
  let r = RANKS[0];
  for (const item of RANKS) { if (state.xp >= item.minXP) r = item; }
  return r;
}

function hydrate() {
  Object.entries(COMPACT_LEXICON).forEach(([code, raw]) => {
    DB[code] = {
      code, name: raw.name, zhRatio: raw.zhRatio, banner: raw.banner,
      themes: raw.themes.map(t => ({
        id: t.id, title: t.title,
        words: t.raw.split("|").map(item => {
          const [sRaw, meaning] = item.split(":");
          const sylStr = sRaw.includes("→") ? sRaw.split("→")[1] : sRaw;
          const syllables = sylStr.split("·");
          const word = syllables.join("");
          return { word, sylStr, syllables, pos: t.pos, meaning, example: `Context: "${word}" is a core ${code} curriculum word.` };
        })
      })),
      grammar: GRAMMAR_DB[code]
    };
  });
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) Object.assign(state, saved);
  } catch (e) {}
  if (!state.activeDays) state.activeDays = {};
  state.activeDays[getTodayKey()] = true;
}

function save() {
  state.activeDays[getTodayKey()] = true;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  $("xpNum").innerText = state.xp;
  $("streakNum").innerText = state.streak;
  const rk = getCurrentRank();
  $("sideRankIcon").innerText = rk.icon;
  $("sideRankTitle").innerText = rk.title;
}

function reward(pts = 10, burst = false) {
  state.xp += pts;
  state.streak += 1;
  save();
  if (burst && window.confetti) confetti({ particleCount: 55, spread: 65, origin: { y: 0.7 } });
}

function speak(text, slow = false) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; u.rate = slow ? 0.58 : 0.94;
  speechSynthesis.speak(u);
}

function toggleDrawer(open) {
  $("leftNav").classList.toggle("-translate-x-full", !open);
  $("drawerBackdrop").classList.toggle("hidden", !open);
}

function renderStepAndMain() {

function renderMain() {
  const box = $("mainBox"), st = DB[state.stage];
  if (state.track === "vocab") {
    const th = st.themes[state.themeIdx];
    const q = ($("searchBox")?.value || "").trim().toLowerCase();
    const words = q ? th.words.filter(w => w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q)) : th.words;
    if (state.step === 1) renderVocabCards(box, th, words);
    else if (state.step === 2) renderVocabMatch(box, th, th.words);
    else if (state.step === 3) renderVocabSpell(box, th, th.words);
    else renderQuiz(box, th.title, th.words.slice().sort(() => Math.random() - 0.5).slice(0, 10).map(w => ({
      q: `"${w.meaning}" 对应的英文单词是：`,
      opts: [...th.words.filter(x => x.word !== w.word).sort(() => Math.random() - 0.5).slice(0, 3), w].sort((a, b) => a.word.localeCompare(b.word)).map(o => o.sylStr),
      ans: w.sylStr
    })), pct => { state.passedThemes[th.id] = Math.max(state.passedThemes[th.id] || 0, pct); });
  } else if (state.track === "grammar") {
    const g = st.grammar[state.grammarIdx];
    if (state.step === 1) renderGrammarFormula(box, g);
    else if (state.step === 2) renderGrammarScrambler(box, g);
    else if (state.step === 3) renderGrammarPitfall(box, g);
    else renderQuiz(box, g.title, g.quiz.map(q => ({ q: q.q, opts: q.opts, ans: q.opts[q.a] })), pct => { state.passedGrammar[g.id] = Math.max(state.passedGrammar[g.id] || 0, pct); });
  } else if (state.track === "listen") {
    renderBlindListeningLab(box, st);
  } else if (state.track === "vibe") {
    renderVibeTrophyRoom(box, st);
  } else {
    const pool = st.themes.flatMap(t => t.words);
    const vQs = pool.slice().sort(() => Math.random() - 0.5).slice(0, 6).map(w => ({
      q: `[词汇] "${w.meaning}" 对应的单词：`,
      opts: [...pool.filter(x => x.word !== w.word).sort(() => Math.random() - 0.5).slice(0, 3), w].sort((a, b) => a.word.localeCompare(b.word)).map(o => o.word),
      ans: w.word
    }));
    const gQs = st.grammar.flatMap(g => g.quiz).sort(() => Math.random() - 0.5).slice(0, 4).map(q => ({
      q: `[语法] ${q.q.replace(/^\d+\.\s*/, '')}`, opts: q.opts, ans: q.opts[q.a]
    }));
    renderQuiz(box, `${st.name} — 阶段晋级 Boss 战`, [...vQs, ...gQs], pct => {
      if (pct > 80) {
        const order = ["KS1", "KS2", "KS3", "KS4"];
        const next = order[order.indexOf(state.stage) + 1];
        if (next) state.unlocked[next] = true;
      }
    }, true);
  }
}

/* ============================================================================
   6. FEATURE #5: BLIND LISTENING DICTATION LAB (WORD & SENTENCE EAR TRAINING)
   ============================================================================ */
function renderBlindListeningLab(box, st) {
  const isWordMode = state.step === 1;
  if (isWordMode) {
    const th = st.themes[state.themeIdx];
    const words = th.words;
    if (blindIdx >= words.length) blindIdx = 0;
    const cur = words[blindIdx];
    // Build pool of target syllables + 2 distractor syllables from same theme
    const extraSyls = words[(blindIdx + 3) % words.length].syllables.slice(0, 2);
    const sylPool = [...cur.syllables, ...extraSyls].sort((a, b) => a.localeCompare(b));

function checkBlindWord(ans, total) {
  const userWord = blindBuilt.join("").trim().toLowerCase();
  const fb = $("blindFeedback");
  if (userWord === ans.toLowerCase()) {
    blindClearedNow = true;
    state.blindClears = (state.blindClears || 0) + 1;
    reward(25, true);
    fb.className = "p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs font-black";
    fb.innerText = `🎧 顺风耳暴击！正确答案正是 "${ans}" (+25 XP)！`;
    speak(ans, false);
    setTimeout(() => { blindIdx = (blindIdx + 1) % total; blindBuilt = []; blindHintShown = false; blindClearedNow = false; renderAll(); }, 1100);
  } else {
    state.streak = 0; save();
    fb.className = "p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-900 text-xs font-black shake";
    fb.innerText = `❌ 听音有偏差，再听一次 0.6x 慢速音节或清空重拼！（目标长度为 ${ans.length} 个字母）`;
  }
}

function checkBlindSentence(ans, total) {
  const userSent = blindBuilt.join(" ").trim().toLowerCase();
  const fb = $("blindFeedback");
  if (userSent === ans.toLowerCase()) {
    blindClearedNow = true;
    state.blindClears = (state.blindClears || 0) + 1;
    reward(25, true);
    fb.className = "p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-emerald-900 text-xs font-black";
    fb.innerText = `🎧 整句盲听满分！+25 XP！`;
    speak(ans, false);
    setTimeout(() => { blindIdx = (blindIdx + 1) % total; blindBuilt = []; blindHintShown = false; blindClearedNow = false; renderAll(); }, 1200);
  } else {
    state.streak = 0; save();
    fb.className = "p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-900 text-xs font-black shake";
    fb.innerText = `❌ 词块顺序不对，再点一次原速/慢速播放仔细辨音！`;
  }
}

  if (!matchLeft) return;

    setTimeout(() => btn.classList.remove("shake", "bg-rose-100", "border-rose-400"), 350);
  }
}

      <div>
        <span class="text-[11px] font-mono bg-violet-100 text-violet-800 px-2 py-0.5 rounded font-bold">${cur.pos}</span>
        <h4 class="text-base font-black text-slate-900 mt-1">${cur.meaning}</h4>
        <p class="text-xs text-slate-500">提示：共 ${cur.syllables.length} 个音节，首字母 <b>${cur.word[0].toUpperCase()}</b></p>
      </div>
      <div class="flex flex-wrap gap-2">
        ${syls.map(s => `<button onclick="builtSyls.push('${s.replace(/'/g, "\\'")}');renderMain()" class="px-3.5 py-2 bg-white border border-slate-300 rounded-xl text-xs font-black btn-bounce shadow-2xs">+ ${s}</button>`).join("")}
        <button onclick="builtSyls=[];renderMain()" class="px-3 py-2 bg-rose-50 text-rose-700 rounded-xl text-xs font-bold">清空</button>
      </div>
      <div class="flex gap-2">
        <input id="spellIn" type="text" value="${builtSyls.join("")}" placeholder="输入完整单词..." class="flex-1 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-black" />
        <button onclick="checkSpell('${cur.word.replace(/'/g, "\\'")}',${words.length})" class="bg-emerald-600 text-white text-xs font-black px-5 py-2.5 rounded-xl btn-bounce">核对</button>
      </div>
      <div id="spellMsg" class="text-xs font-black"></div>
      <div class="flex justify-between pt-2 border-t border-slate-200 text-xs font-bold">
        <button onclick="spellIdx=Math.max(0,spellIdx-1);builtSyls=[];renderMain()">← 上一词</button>
        <button onclick="spellIdx=(spellIdx+1)%${words.length};builtSyls=[];renderMain()" class="text-violet-600">下一词 →</button>
      </div>
    </div>`;
}

function checkSpell(ans, total) {
  const val = ($("spellIn")?.value || "").trim().toLowerCase();
  if (val === ans.toLowerCase()) {
    $("spellMsg").className = "text-xs font-black text-emerald-600";
    $("spellMsg").innerText = "🎉 拼写暴击 +15 XP！";
    speak(ans, false); reward(15, true);
    setTimeout(() => { spellIdx = (spellIdx + 1) % total; builtSyls = []; renderMain(); }, 750);
  } else {
    state.streak = 0; save();
    $("spellMsg").className = "text-xs font-black text-rose-600 shake";
    $("spellMsg").innerText = `❌ 正确拼写：${ans}`;
  }
}

function renderGrammarFormula(box, g) {
  box.innerHTML = `
    <div class="space-y-4">
      <h3 class="font-black text-lg text-slate-900">${g.title}</h3>
      <div class="p-4 rounded-2xl bg-slate-950 text-white">
        <div class="text-[11px] text-amber-300 font-bold">📐 核心造句公式</div>
        <div class="font-mono text-sm font-black mt-1">${g.formula}</div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="p-4 rounded-2xl bg-violet-50 border border-violet-200 text-xs leading-relaxed"><b>📘 语法拆解：</b>${g.guide}</div>
        <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-xs leading-relaxed font-bold text-rose-950"><b>⚠️ 中英思维对比：</b>${g.contrast}</div>
      </div>
      <div class="space-y-2.5">
        <div class="text-xs font-black text-slate-600">🎨 句子成分色彩拆解 (点击发声)：</div>
        ${g.examples.map(ex => {
          const full = `${ex.s} ${ex.v} ${ex.o} ${ex.m}`.trim();
          return `<div onclick="speak('${full.replace(/'/g, "\\'")}',false)" class="pop-card cursor-pointer p-3.5 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-2">
            <div class="space-y-1">
              <div class="flex flex-wrap gap-1.5 text-xs font-black">
                <span class="px-2.5 py-1 rounded-lg role-S">${ex.s}</span>
                <span class="px-2.5 py-1 rounded-lg role-V">${ex.v}</span>
                <span class="px-2.5 py-1 rounded-lg role-O">${ex.o}</span>
                ${ex.m ? `<span class="px-2.5 py-1 rounded-lg role-M">${ex.m}</span>` : ''}
              </div>
              <div class="text-xs text-slate-500">${ex.zh}</div>
            </div>
            <span class="text-sm bg-violet-600 text-white px-3 py-1.5 rounded-xl font-black shrink-0">🔊</span>
          </div>`;
        }).join("")}
      </div>
      <button onclick="state.step=2;renderStepAndMain()" class="w-full sm:w-auto bg-emerald-600 text-white text-xs font-black px-5 py-3 rounded-xl btn-bounce">进入第2步：词块造句训练 →</button>
    </div>`;
}

function renderGrammarScrambler(box, g) {
  const list = g.scramblers;
  if (scramIdx >= list.length) scramIdx = 0;
  const item = list[scramIdx];
  const chunks = [...item.chunks].sort((a, b) => a.localeCompare(b));

  box.innerHTML = `
    <div class="max-w-xl mx-auto space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-black text-base">🧩 点击词块重组造句 (${scramIdx + 1}/${list.length})</h3>
        <button onclick="speak('${item.ans.replace(/'/g, "\\'")}',false)" class="bg-violet-600 text-white text-xs font-black px-3 py-1.5 rounded-xl">🔊 听整句</button>
      </div>
      <div class="p-5 rounded-3xl bg-slate-50 border border-slate-200 space-y-4">
        <div class="text-sm font-black text-slate-900">🎯 目标：${item.prompt}</div>
        <div class="flex flex-wrap gap-2">
          ${chunks.map(c => `<button onclick="builtChunks.push('${c.replace(/'/g, "\\'")}');renderMain()" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-xs font-black btn-bounce shadow-2xs">+ ${c}</button>`).join("")}
          <button onclick="builtChunks=[];renderMain()" class="px-3 py-2 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold">重排</button>
        </div>
        <div class="min-h-[52px] p-3.5 rounded-2xl bg-white border-2 border-dashed border-emerald-400 text-sm font-black text-slate-900 flex items-center">
          ${builtChunks.join(" ") || "点击上方词块拼出地道英语句子..."}
        </div>
        <button onclick="checkScrambler('${item.ans.replace(/'/g, "\\'")}',${list.length})" class="w-full bg-emerald-600 text-white font-black text-xs py-3 rounded-xl btn-bounce shadow">⚡ 核对语序</button>
        <div id="scramMsg" class="text-xs font-black"></div>
      </div>
    </div>`;
}

function checkScrambler(ans, total) {
  if (builtChunks.join(" ").trim().toLowerCase() === ans.toLowerCase()) {
    $("scramMsg").className = "text-xs font-black text-emerald-600";
    $("scramMsg").innerText = "✅ 语序满分 +20 XP！";
    speak(ans, false); reward(20, true);
    setTimeout(() => { scramIdx = (scramIdx + 1) % total; builtChunks = []; renderMain(); }, 950);
  } else {
    state.streak = 0; save();
    $("scramMsg").className = "text-xs font-black text-rose-600 shake";
    $("scramMsg").innerText = `❌ 标准语序：${ans}`;
  }
}

function renderGrammarPitfall(box, g) {
  box.innerHTML = `
    <div class="space-y-4">
      <h3 class="font-black text-base">🩺 第3步：中式英语病句诊断诊所</h3>
      ${g.pitfalls.map((p, i) => {
        const key = `${g.id}_${i}`, ok = pitSolved[key];
        return `<div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 space-y-2.5">
          <div class="text-xs font-black text-rose-700 bg-rose-50 px-3 py-2 rounded-xl">❌ 病句：<span class="line-through">${p.wrong}</span></div>
          <div class="space-y-1.5">
            ${p.options.map((opt, oi) => `<button onclick="solvePit('${key}',${oi},${p.ans},this)" class="w-full text-left p-3 rounded-xl border text-xs font-bold btn-bounce ${ok && oi === p.ans ? 'bg-emerald-100 border-emerald-500 text-emerald-950 font-black' : 'bg-white border-slate-200'}">${opt}</button>`).join("")}
          </div>
          ${ok ? `<div class="p-3 rounded-xl bg-emerald-50 text-xs text-emerald-900">💡 <b>解析：</b>${p.explain}</div>` : ''}
        </div>`;
      }).join("")}
      <button onclick="state.step=4;renderStepAndMain()" class="bg-emerald-600 text-white text-xs font-black px-5 py-3 rounded-xl btn-bounce">进入第4步：单元过关测验 →</button>
    </div>`;
}

function solvePit(key, chosen, ans, btn) {
  if (chosen === ans) { pitSolved[key] = true; reward(15, false); renderMain(); }
  else { btn.classList.add("shake", "bg-rose-100"); setTimeout(() => btn.classList.remove("shake", "bg-rose-100"), 350); }
}

function renderQuiz(box, title, questions, onPass, isBoss = false) {
  box.innerHTML = `
    <div class="pb-3 mb-4 border-b border-slate-100">
      <h3 class="font-black text-base">${title}</h3>
      <p class="text-xs text-slate-500">${isBoss ? '答对严格大于 80% (至少 9/10) 即可解锁下一 Key Stage！' : '答对 ≥80% 即可通关并解锁下一单元！'}</p>
    </div>
    <form onsubmit="submitQuiz(event, ${isBoss})" class="space-y-3">
      ${questions.map((q, i) => `
        <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/70">
          <div class="text-xs font-black mb-2">Q${i + 1}. ${q.q}</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${q.opts.map(opt => `<label class="flex items-center gap-2 p-2.5 rounded-xl border bg-white text-xs font-bold cursor-pointer hover:border-violet-400">
              <input type="radio" name="q_${i}" value="${opt.replace(/"/g, '&quot;')}" data-ans="${q.ans.replace(/"/g, '&quot;')}" required />
              <span>${opt}</span>
            </label>`).join("")}
          </div>
        </div>`).join("")}
      <div id="quizMsg"></div>
      <button type="submit" class="w-full sm:w-auto bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-black text-xs px-6 py-3 rounded-xl btn-bounce shadow">⚡ 提交成绩</button>
    </form>`;
  window._currentQuizCallback = onPass;
}

function submitQuiz(e, isBoss) {
  e.preventDefault();
  const checked = e.target.querySelectorAll("input[type=radio]:checked");
  let right = 0;
  checked.forEach(r => { if (r.value === r.dataset.ans) right++; });
  const pct = Math.round((right / checked.length) * 100);
  const passed = isBoss ? pct > 80 : pct >= 80;
  if (window._currentQuizCallback) window._currentQuizCallback(pct);
  if (passed) reward(50, true);
  save();
  $("quizMsg").innerHTML = `<div class="p-4 rounded-2xl ${passed ? 'bg-emerald-50 border border-emerald-400 text-emerald-950' : 'bg-rose-50 border border-rose-300 text-rose-900'} text-xs font-black">
    ${passed ? `🏆 得分 ${pct}% (${right}/${checked.length}) — 恭喜通关 (+50 XP)！可前往「🏆 成就卡」查看新徽章！` : `⚠️ 得分 ${pct}% (${right}/${checked.length}) — 还未达标，再刷一次吧！`}
  </div>`;
  renderAll();
}

/* ============================================================================
   9. GLOBAL NAVIGATION CONTROLS
   ============================================================================ */
function setStage(code) {
  if (!state.unlocked[code]) return alert("请先在当前阶段 Boss 战取得 >80% 成绩，或点击左下角「🔓 一键全解锁」！");
  state.stage = code; state.themeIdx = 0; state.grammarIdx = 0; state.step = 1; state.page = 0;
  blindIdx = 0; blindBuilt = [];
  toggleDrawer(false); renderAll();
}

function switchTrack(t) {
  state.track = t; state.step = 1; state.page = 0;
  blindIdx = 0; blindBuilt = []; blindHintShown = false; blindClearedNow = false;
  toggleDrawer(false); renderAll();
}

function selectUnit(track, idx, ok) {
  if (!ok) return alert("请先通过上一单元的测验 (≥80%) 解锁！");
  if (track === "vocab" || (track === "listen" && state.step === 1)) state.themeIdx = idx;
  else state.grammarIdx = idx;
  if (track !== "listen") state.step = 1;
  state.page = 0; blindIdx = 0; blindBuilt = [];
  toggleDrawer(false); renderAll();
}

function unlockAll() {
  state.unlocked = { KS1: true, KS2: true, KS3: true, KS4: true };
  state.passedThemes.ALL = true;
  reward(25, true); toggleDrawer(false); renderAll();
}

function resetProgress() {
  if (!confirm("确定重置所有进度、打卡记录和成就卡吗？")) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

hydrate();
renderAll();
</script>
</body>
</html>
